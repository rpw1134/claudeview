<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The Content-Security-Policy meta tag is injected here by the `csp` plugin in
      vite.config.ts, because it has to differ between dev and production.

      Production is locked down — in particular `connect-src 'none'`, since the
      renderer never talks to the network at all: everything it needs arrives over
      IPC. That turns an accidental fetch() into a load-time failure instead of a
      silent data leak.

      Dev has to be looser: Vite's HMR runs over a WebSocket and React Fast Refresh
      injects an inline preamble script, both of which the production policy blocks.
      The relaxations are scoped to localhost and only ever apply to the dev server.
    -->
    <!--CSP-->
    <title>ClaudeView</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
